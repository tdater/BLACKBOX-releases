name: Release APK

# Builds BLACKBOX from the public source repo and publishes the APK as a release here.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g. 0.1.0)
        required: true
        default: "0.3.0"
      ref:
        description: Branch, tag or commit of tdater/tdater-BLACKBOX to build
        required: true
        default: feat/universal

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tdater/tdater-BLACKBOX
          ref: ${{ inputs.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          # Newer source has two editions (standard, net); older refs build a single debug APK.
          if [ -f app/build/outputs/apk/standard/debug/app-standard-debug.apk ]; then
            cp app/build/outputs/apk/standard/debug/app-standard-debug.apk "BLACKBOX-${VERSION}.apk"
            cp app/build/outputs/apk/net/debug/app-net-debug.apk "BLACKBOX-Net-${VERSION}.apk"
            FILES="BLACKBOX-${VERSION}.apk BLACKBOX-Net-${VERSION}.apk"
            NOTES="Download **BLACKBOX-${VERSION}.apk** below and open it on your phone. Android 10 or newer. It never uses the internet.

          **BLACKBOX-Net-${VERSION}.apk** is the optional edition with ping, port check and DNS tools. It is the only one with internet permission and installs alongside the regular app with its own records.

          See https://tdater.github.io/BLACKBOX-releases/ for what it does."
          else
            cp app/build/outputs/apk/debug/app-debug.apk "BLACKBOX-${VERSION}.apk"
            FILES="BLACKBOX-${VERSION}.apk"
            NOTES="Download **BLACKBOX-${VERSION}.apk** below and open it on your phone. Android 10 or newer. See https://tdater.github.io/BLACKBOX-releases/ for what it does."
          fi
          gh release create "v${VERSION}" $FILES \
            --repo "${{ github.repository }}" \
            --title "BLACKBOX ${VERSION}" \
            --notes "$NOTES" \
            --latest
